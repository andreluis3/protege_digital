<article class="progress-card" aria-labelledby="journey-title">
    <p class="eyebrow">Sua jornada</p>
    <h2 id="journey-title">{{ current_module.title }}</h2>
    <div class="progress-row" aria-label="Progresso geral de {{ overall_progress }}%">
        <div class="progress-track"><span style="--progress: {{ overall_progress }}%;"></span></div>
        <strong>{{ overall_progress }}%</strong>
    </div>
    <p>{{ completed_lessons }} de {{ total_lessons }} aulas concluídas</p>
    <a class="btn btn-primary" href="{% if current_module.number %}{% url 'core:player' current_module.number current_module.next_lesson|default:1 %}{% else %}#modules-title{% endif %}">Continuar estudando →</a>
</article>

{% load static %}
<header class="site-header" data-site-header>
    <nav class="navbar container" aria-label="Navegação principal">
        <a class="brand" href="{% url 'core:home' %}" aria-label="Proteção Digital - Início">
            <img
            class="brand-mark"
            src="{% static 'assets/resources/icons/shield_logo.png' %}"
            alt=""
            aria-hidden="true"
            >
            <span>Proteção Digital</span>
        </a>

        <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="primary-menu" data-nav-toggle>
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="nav-panel" id="primary-menu" data-nav-panel>
            <ul class="nav-links">
                <li><a href="{% url 'core:home' %}">Início</a></li>
                <li><a href="{% url 'core:sobre' %}">O projeto</a></li>
                {% if user.is_authenticated %}<li><a href="{% url 'core:curso' %}">Meu curso</a></li>{% endif %}
            </ul>

            <div class="nav-actions">
                {% if user.is_authenticated %}
                    <span class="nav-login">{{ user.get_full_name|default:user.email }}</span>
                    <a class="nav-login" href="{% url 'core:curso' %}">Meu curso</a>
                    <form method="post" action="{% url 'accounts:logout' %}" class="nav-logout">{% csrf_token %}<button class="nav-login" type="submit">Sair</button></form>
                {% else %}
                    <a class="nav-login" href="{% url 'accounts:login' %}">Entrar</a>
                    <a class="nav-login" href="{% url 'accounts:cadastro' %}">Cadastrar</a>
                {% endif %}
                <button class="theme-toggle" type="button" aria-label="Alternar tema" data-theme-toggle>
                    <span class="theme-toggle-icon" aria-hidden="true" data-theme-icon>🌙</span>
                </button>
            </div>
        </div>
    </nav>
</header>

{% load static %}
<header class="course-topbar">
    <a class="course-brand" href="{% url 'core:home' %}" aria-label="Protege Digital - Início">
        <img
            class="brand-mark"
            src="{% static 'assets/resources/icons/shield_logo.png' %}"
            alt=""
            aria-hidden="true"
        >
        <span>Protege Digital</span>
    </a>

    <div class="course-user-actions">
        <span class="course-user" aria-label="Usuário autenticado">{{ display_name|default:user.email }}</span>
        <button class="theme-toggle" type="button" aria-label="Alternar tema" data-theme-toggle>
            <span class="theme-toggle-icon" aria-hidden="true" data-theme-icon>🌙</span>
        </button>
        <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="btn btn-secondary btn-small" type="submit">Sair</button></form>
    </div>
</header>

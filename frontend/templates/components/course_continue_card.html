<article class="continue-card" id="continue-card" aria-labelledby="continue-title">
    <p class="eyebrow">Continue de onde parou</p>
    <span class="lesson-module">Módulo {{ current_module.number|stringformat:"02d" }}</span>
    <h2 id="continue-title">{{ current_module.title }}</h2>
    <p>Volte para a trilha e avance no seu ritmo.</p>
    <a class="btn btn-secondary" href="{% url 'core:player' current_module.number current_module.next_lesson|default:1 %}">Continuar aula →</a>
</article>
